syntax = "proto3";

// Package cwb.cairn.v1 is cairn's JSON API surface (repos, pull requests, and
// the cross-pillar org purge), migrated to gRPC behind interchange (Phase 3).
// It lives in its OWN package — not the shared cwb.v1 used by ledger and
// commonplace — because cairn needs its own OrgService (PurgeOrg), which would
// hard-clash with ledger's OrgService in a single package. cairn's git wire
// protocol (Smart-HTTP + SSH) is NOT here: git can't be gRPC and stays on its
// existing transports; only the JSON API moves.
package cwb.cairn.v1;

import "google/api/annotations.proto";

option go_package = "github.com/CarriedWorldUniverse/cwb-proto/gen/go/cwb/cairn/v1;cairnv1";

// RepoService — repository administration. (The Smart-HTTP git byte protocol
// is served by cairn's retained HTTP server, not by this service.)
service RepoService {
  // CreateRepo mirrors POST /api/orgs/{org}/repos (scope repo:write; the path
  // {org} must equal the caller's verified org). response_body:"repo" keeps the
  // REST shape flat: {id, org, slug, default_branch}.
  rpc CreateRepo(CreateRepoRequest) returns (CreateRepoResponse) {
    option (google.api.http) = {
      post: "/api/orgs/{org}/repos"
      body: "*"
      response_body: "repo"
    };
  }
  // ListRepos lists the caller-org's repos (scope repo:read). response_body:"repos".
  rpc ListRepos(ListReposRequest) returns (ListReposResponse) {
    option (google.api.http) = {
      get: "/api/orgs/{org}/repos"
      response_body: "repos"
    };
  }
}

// PullService — pull requests: open (creates the linked ledger issue), get, and
// fast-forward-only merge (best-effort comments the ledger issue).
service PullService {
  // OpenPull mirrors POST /api/orgs/{org}/repos/{slug}/pulls (scope repo:write).
  // Idempotent per (repo, source, target) while open. response_body:"pull".
  rpc OpenPull(OpenPullRequest) returns (OpenPullResponse) {
    option (google.api.http) = {
      post: "/api/orgs/{org}/repos/{slug}/pulls"
      body: "*"
      response_body: "pull"
    };
  }
  // GetPull mirrors GET /api/orgs/{org}/repos/{slug}/pulls/{id} (scope repo:read).
  rpc GetPull(GetPullRequest) returns (GetPullResponse) {
    option (google.api.http) = {
      get: "/api/orgs/{org}/repos/{slug}/pulls/{id}"
      response_body: "pull"
    };
  }
  // MergePull mirrors POST /api/orgs/{org}/repos/{slug}/pulls/{id}/merge (scope
  // repo:write). No request body — path params only. response_body:"result".
  rpc MergePull(MergePullRequest) returns (MergePullResponse) {
    option (google.api.http) = {
      post: "/api/orgs/{org}/repos/{slug}/pulls/{id}/merge"
      response_body: "result"
    };
  }
  // ListPulls lists a repo's pulls (scope repo:read); optional ?state= filter
  // ("open"|"merged"|"all"; default all). response_body:"pulls".
  rpc ListPulls(ListPullsRequest) returns (ListPullsResponse) {
    option (google.api.http) = {
      get: "/api/orgs/{org}/repos/{slug}/pulls"
      response_body: "pulls"
    };
  }
  // RecordPullCheck mirrors POST
  // /api/orgs/{org}/repos/{slug}/pulls/{id}/checks (scope repo:write). Upserts
  // by (pull, name): re-recording a check with the same name replaces its
  // state/summary/evidence_url. response_body:"check".
  rpc RecordPullCheck(RecordPullCheckRequest) returns (RecordPullCheckResponse) {
    option (google.api.http) = {
      post: "/api/orgs/{org}/repos/{slug}/pulls/{id}/checks"
      body: "*"
      response_body: "check"
    };
  }
  // ListPullChecks mirrors GET /api/orgs/{org}/repos/{slug}/pulls/{id}/checks
  // (scope repo:read). response_body:"checks".
  rpc ListPullChecks(ListPullChecksRequest) returns (ListPullChecksResponse) {
    option (google.api.http) = {
      get: "/api/orgs/{org}/repos/{slug}/pulls/{id}/checks"
      response_body: "checks"
    };
  }
}

// OrgService — cross-pillar org purge (NEX-402). Org-bound by construction: the
// target org is the caller's verified org (cwb-org metadata), never a path or
// body field, so a caller can only ever purge its own org.
service OrgService {
  // PurgeOrg mirrors DELETE /api/org (scope org:purge). Deletes all repos for
  // the caller's org. Idempotent: zero repos -> still succeeds.
  rpc PurgeOrg(PurgeOrgRequest) returns (PurgeOrgResponse) {
    option (google.api.http) = {delete: "/api/org"};
  }
}

// ---- messages ----

// Repo is a repository as returned by CreateRepo.
message Repo {
  string id = 1;
  string org = 2;
  string slug = 3;
  string default_branch = 4;
}

message CreateRepoRequest {
  string org = 1; // path param; must equal the caller's verified org
  string slug = 2; // body
}
message CreateRepoResponse {
  Repo repo = 1;
}

message ListReposRequest {
  string org = 1; // path
}
message ListReposResponse {
  repeated Repo repos = 1;
}

// Pull is a pull request. `repo` is the repo slug (mirrors the REST field).
message Pull {
  string id = 1;
  string repo = 2;
  string source = 3;
  string target = 4;
  string title = 5;
  string state = 6;
  string ledger_issue_key = 7;
  string url = 8;
}

message OpenPullRequest {
  string org = 1; // path
  string slug = 2; // path
  string source = 3;
  string target = 4;
  string title = 5;
  string description = 6;
  string project = 7;
  string definition_of_done = 8;
}
message OpenPullResponse {
  Pull pull = 1;
}

message ListPullsRequest {
  string org = 1; // path
  string slug = 2; // path
  string state = 3; // query ?state= ; "" or "all" => every state
}
message ListPullsResponse {
  repeated Pull pulls = 1;
}

message GetPullRequest {
  string org = 1; // path
  string slug = 2; // path
  string id = 3; // path
}
message GetPullResponse {
  Pull pull = 1;
}

message MergePullRequest {
  string org = 1; // path
  string slug = 2; // path
  string id = 3; // path
}

// MergeResult mirrors the REST merge response; ledger_comment_error is set only
// when the best-effort ledger comment failed (the merge itself still stands).
message MergeResult {
  string id = 1;
  string state = 2;
  string target = 3;
  string merged_sha = 4;
  string ledger_comment_error = 5;
}
message MergePullResponse {
  MergeResult result = 1;
}

// PullCheck is a recorded check verdict on a pull (e.g. CI, review, security).
// `state` is one of "pass"|"fail"|"pending". Re-recording the same `name` on
// the same pull upserts (replaces state/summary/evidence_url/recorder/time).
message PullCheck {
  string id = 1;
  string pull_id = 2;
  string name = 3;
  string state = 4; // "pass" | "fail" | "pending"
  string summary = 5;
  string evidence_url = 6;
  string recorded_by = 7;
  string recorded_at = 8; // RFC3339
}

message RecordPullCheckRequest {
  string org = 1; // path
  string slug = 2; // path
  string id = 3; // path; pull id
  string name = 4; // body
  string state = 5; // body; "pass" | "fail" | "pending"
  string summary = 6; // body
  string evidence_url = 7; // body
}
message RecordPullCheckResponse {
  PullCheck check = 1;
}

message ListPullChecksRequest {
  string org = 1; // path
  string slug = 2; // path
  string id = 3; // path; pull id
}
message ListPullChecksResponse {
  repeated PullCheck checks = 1;
}

message PurgeOrgRequest {}

// PurgeOrgResponse mirrors the REST shape {"purged": "<org>", "repos": <n>}.
message PurgeOrgResponse {
  string purged = 1;
  int32 repos = 2;
}

name: buf

on:
  push:
    branches: [main]
  pull_request:

# The buf-action posts a PR comment with lint/breaking results; that needs
# pull-requests: write (the default token is read-only for that scope on PRs).
permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history (breaking-change detection)

      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          breaking: true
          # Compare against the published main over HTTPS (cwb-proto is public).
          # On PR builds the local .git has no `main` branch ref, so the local
          # ".git#branch=main" form fails to clone (exit 128); the remote URL
          # always resolves.
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=main"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install codegen plugins
        # Pinned to the versions the committed gen/ was produced with, so the
        # drift check below is deterministic (@latest could regenerate slightly
        # different output and spuriously fail).
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v2.29.0

      - name: Regenerate and check for drift
        run: |
          rm -rf gen/go
          mkdir -p gen/go
          buf generate
          git diff --exit-code gen/

      - name: Build generated Go
        run: go build ./...
